name: Pull Request

on:
  pull_request:

permissions:
  id-token: write

jobs:
  validate:
    name: ✅ Validate Terraform
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Terraform
        uses: jdx/mise-action@v4.0.0
        with:
          mise_toml: |
            [tools]
            terraform = "latest"

      - name: Init
        working-directory: modules
        run: |
          terraform init

      - name: Lint
        working-directory: modules
        run: |
          terraform fmt --check

      - name: Validate
        working-directory: modules
        run: |
          terraform validate
